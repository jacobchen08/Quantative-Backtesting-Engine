# Tool configuration only (ruff + pytest). Dependencies live in requirements*.txt.

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# NPY catches the legacy np.random global API, which §2.4 forbids.
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Scripts run as `python scripts\x.py` and put backend\ on sys.path before importing the app.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
# Any warning fails a test: a RuntimeWarning in numerical code usually means a silent NaN or inf.
filterwarnings = ["error"]
